<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD Pipeline Security — Scene-by-Scene Walkthrough</title>
<style>
  :root{
    --bg:#faf8f5;
    --paper:#ffffff;
    --ink:#1d2127;
    --muted:#6a7078;
    --line:#e7e3dc;
    --accent:#0c8599;
    --accent-soft:#d3eef2;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 56px}

  header{margin-bottom:28px}
  .eyebrow{
    font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:0 0 10px;
  }
  h1{
    margin:0;font-size:clamp(28px,4.2vw,42px);line-height:1.1;
    font-weight:680;letter-spacing:-.025em;
  }
  .sub{margin:10px 0 0;color:var(--muted);font-size:17px}

  .meta{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    margin-bottom:12px;
  }
  .count{
    font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--ink);
    letter-spacing:.04em;
  }
  .count span{color:var(--muted);font-weight:500}
  .label{
    font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    text-align:right;
  }

  .stage{
    position:relative;
    aspect-ratio:16/9;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(30,30,20,.04),0 18px 40px -18px rgba(30,30,20,.18);
  }
  .canvas{
    position:absolute;inset:0;
    transition:opacity .22s ease,transform .22s ease;
  }
  .canvas.out-next{opacity:0;transform:translateX(-14px)}
  .canvas.out-prev{opacity:0;transform:translateX(14px)}
  #diagram{display:block;width:100%;height:100%}
  #diagram rect[stroke="#bbb"]{stroke:none}

  .caption{
    margin:22px auto 0;max-width:68ch;text-align:center;
    font-size:18px;line-height:1.55;color:#33383f;
    min-height:3.1em;
    transition:opacity .22s ease;
  }
  .caption.out{opacity:0}

  .progress{
    display:grid;grid-template-columns:repeat(13,1fr);gap:6px;
    margin:26px 0 22px;
  }
  .tick{
    position:relative;height:18px;padding:0;border:0;background:none;cursor:pointer;
  }
  .tick::before{
    content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;
    background:var(--line);transition:background .2s ease;
  }
  .tick.done::before{background:#c9c4ba}
  .tick.active::before{background:var(--accent)}
  .tick:hover::before{background:#b5afa3}
  .tick.active:hover::before{background:var(--accent)}
  .tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .tick.active.playing::after{
    content:"";position:absolute;left:0;top:7px;height:4px;border-radius:2px;
    background:#0a6c7c;width:0;animation:fill var(--dur,6s) linear forwards;
  }
  @keyframes fill{to{width:100%}}

  .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  button.btn{
    font:inherit;font-size:15px;font-weight:600;
    padding:10px 18px;border-radius:999px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .1s ease,opacity .15s;
  }
  button.btn:hover:not(:disabled){border-color:#c9c4ba;background:#fdfcfa}
  button.btn:active:not(:disabled){transform:translateY(1px)}
  button.btn:disabled{opacity:.4;cursor:default}
  button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  button.btn.primary:hover:not(:disabled){background:#2c323a;border-color:#2c323a}
  button.btn.play.on{background:var(--accent-soft);border-color:#a8dbe3;color:#0a6c7c}

  .hint{margin:22px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
  kbd{
    font:inherit;font-size:12px;padding:1px 6px;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;background:var(--paper);
  }

  @media (max-width:640px){
    .wrap{padding:28px 14px 40px}
    .caption{font-size:16.5px;min-height:5.2em}
    .progress{gap:4px}
    .label{font-size:11px}
    .hint .kbds{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .canvas,.caption{transition:none}
    .tick.active.playing::after{animation:none;width:100%}
  }
</style>
</head>

"><path d="M38-0.3C44.7-0.4 53.3 4.4 58.8 9C64.4 13.7 69.6 20.9 71.3 27.5C73.1 34.1 72 41.9 69.3 48.5C66.6 55 61.1 63 55.2 67.1C49.3 71.1 40.8 73.3 33.9 72.9C26.9 72.5 19.1 69.4 13.7 64.7C8.3 60.1 3.3 52 1.5 45.1C-0.4 38.1 0.3 29.7 2.7 23.1C5 16.4 9.2 9.3 15.6 5.3C21.9 1.4 36.4-0.2 40.9-0.7C45.4-1.2 42.5 1.5 42.3 2.3M49.8 2.1C56.2 4.2 62.2 10 66 16.1C69.8 22.3 73 31.9 72.7 39.1C72.5 46.3 69.3 53.9 64.5 59.2C59.6 64.5 50.8 69.6 43.7 71.1C36.5 72.5 27.7 71 21.5 68.1C15.3 65.2 10 59.5 6.7 53.5C3.4 47.6 1.1 39.3 1.4 32.7C1.8 26.1 4.4 19.2 8.6 14C12.9 8.9 20.1 3.8 27 1.7C33.9-0.4 46.6 1.1 50.2 1.6C53.7 2.1 48.5 4 48.3 4.6" stroke="none" stroke-width="0" fill="#b2f2bb"></path><path d="M18.3 5.2C24.1 1.5 33.9-0.5 41.1 0.4C48.3 1.3 56.6 5.7 61.7 10.6C66.8 15.6 70.6 23.4 71.6 30.1C72.5 36.9 70.6 45.2 67.5 51.4C64.5 57.5 59.5 63.7 53.3 67.2C47 70.6 37.2 73.3 30.1 72.3C23.1 71.3 16 66.5 10.9 61.4C5.8 56.3 0.9 48.7-0.4 41.7C-1.8 34.7-0.9 25.7 2.8 19.3C6.4 12.8 17.8 6 21.6 3.1C25.3 0.3 25.1 1.4 25.1 1.9M22.4 1.8C28.5-1.7 38.4-2.1 45.3-0.5C52.2 1.1 59.4 5.9 63.7 11.2C68 16.6 70.7 24.3 71 31.4C71.3 38.6 68.9 47.9 65.6 54.1C62.2 60.4 57.4 65.7 51 68.8C44.5 71.8 33.7 74.1 26.8 72.4C19.9 70.7 14 64.2 9.4 58.5C4.8 52.8 0.2 45.2-0.6 38.2C-1.4 31.2 0.8 22.7 4.6 16.6C8.3 10.5 18.6 4 21.8 1.6C24.9-0.7 23 1.4 23.5 2.3" stroke="#2f9e44" stroke-width="2" fill="none"></path></g></g><g clip-path="url(#aZxEVgIdUXWQ6edpvJwRV)"><g transform="translate(381.1 4593.6)"><use href="#image-e4f69286a8d21635fb1131dd180c96b385704cf0" width="38" height="38" opacity="1"></use></g></g><g clip-path="url(#aZxEVgIdUXWQ6edpvJwRV)"><g transform="translate(450.5 4588.8)"><text x="289.5" y="33.5" font-family="Virgil, sans-serif, Segoe UI Emoji" font-size="38px" fill="#2f9e44" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Secure the pipeline itself</text></g></g><g transform="translate(10 3930)"><text x="0" y="12.5" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="14px" fill="#999999" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Scene 13 · Recap</text></g><rect transform="translate(10 3950.5)" width="1280px" height="720px" rx="8" ry="8" fill="none" stroke="#bbb" stroke-width="2"></rect></svg>

  <p class="caption" id="caption" aria-live="polite"></p>

  <div class="progress" id="progress" role="tablist" aria-label="Scenes"></div>

  <div class="controls">
    <button class="btn" id="prev" type="button">← Previous</button>
    <button class="btn primary" id="next" type="button">Next scene →</button>
    <button class="btn play" id="play" type="button" aria-pressed="false">▶ Auto-play</button>
  </div>

  <p class="hint">Step through all 13 scenes with Previous / Next or Auto-play.<span class="kbds"> Keyboard: <kbd>←</kbd> <kbd>→</kbd> to move, <kbd>Space</kbd> to play.</span></p>
</div>

<script>
(function(){
  var SCENES = [
  {
    "title": "Hook",
    "caption": "Every release crosses five stages, and an attacker needs only one weak spot. The goal: secure the pipeline itself."
  },
  {
    "title": "What is CI/CD",
    "caption": "CI builds and tests every change; CD ships it. Delivery ends in a manual push, deployment automates the whole way."
  },
  {
    "title": "Why attackers love it",
    "caption": "A pipeline reaches repos, servers, builds, deploys and people at high privilege, which is why SolarWinds and Codecov hurt."
  },
  {
    "title": "Top 10 risks",
    "caption": "OWASP lists ten CI/CD risks, from weak IAM to logging gaps. The next scenes answer the big ones."
  },
  {
    "title": "Secure the SCM",
    "caption": "Protect the source first: required reviews, protected branches, signed commits, MFA, restricted forks and least-privilege access."
  },
  {
    "title": "Harden the pipeline",
    "caption": "Isolate build nodes, lock down the CI server, keep config out of the repo, and gate production behind scans and approval."
  },
  {
    "title": "Secrets",
    "caption": "Keep secrets out of code. Fetch them from a vault at runtime as short-lived credentials, and scan commits and logs for leaks."
  },
  {
    "title": "Least privilege + identities",
    "caption": "Deny by default so one pipeline can't reach another's resources, and track every identity from joiner to leaver."
  },
  {
    "title": "Dependency abuse",
    "caption": "Typosquatting, dependency confusion and account takeover arrive via public registries. Pin versions, verify hashes, use one private feed."
  },
  {
    "title": "Plug-ins",
    "caption": "Vet every plug-in before it runs: trusted vendor, security history, active upkeep. Then keep it patched and remove what's unused."
  },
  {
    "title": "Integrity",
    "caption": "Signed commits, pinned hashes and code signing form one chain. Tamper with any link and verification fails."
  },
  {
    "title": "Visibility",
    "caption": "Send logs from repo, CI and runners to a SIEM so analysts get alerts. Keep secrets out of logs and tune for false positives."
  },
  {
    "title": "Recap",
    "caption": "No single control is enough. Layer them across every stage and the pipeline itself becomes secure."
  }
];
  var COLS = [10,1490,2970];
  var ROWS = [30.5,1010.5,1990.5,2970.5,3950.5];
  var W = 1280, H = 720, DWELL = 6500;

  var stage = document.getElementById('stage');
  var svg = document.getElementById('diagram');
  var canvas = document.getElementById('canvas');
  var countEl = document.getElementById('count');
  var labelEl = document.getElementById('label');
  var capEl = document.getElementById('caption');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var playBtn = document.getElementById('play');
  var progress = document.getElementById('progress');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cur = -1, playing = false, timer = null, busy = null;

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  SCENES.forEach(function(s, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tick';
    b.setAttribute('role','tab');
    b.setAttribute('aria-label','Scene ' + (i+1) + ': ' + s.title);
    b.title = pad(i+1) + ' · ' + s.title;
    b.addEventListener('click', function(){ stop(); go(i); });
    progress.appendChild(b);
  });
  var ticks = progress.children;

  function viewBox(i){
    return COLS[i % 3] + ' ' + ROWS[Math.floor(i / 3)] + ' ' + W + ' ' + H;
  }

  function paint(i){
    var s = SCENES[i];
    svg.setAttribute('viewBox', viewBox(i));
    countEl.innerHTML = pad(i+1) + ' <span>/ ' + SCENES.length + '</span>';
    labelEl.textContent = s.title;
    capEl.textContent = s.caption;
    for (var k = 0; k < ticks.length; k++){
      ticks[k].classList.toggle('done', k < i);
      ticks[k].classList.toggle('active', k === i);
      ticks[k].classList.remove('playing');
      ticks[k].setAttribute('aria-selected', k === i ? 'true' : 'false');
    }
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === SCENES.length - 1;
    if (playing){
      var t = ticks[i];
      t.style.setProperty('--dur', DWELL + 'ms');
      void t.offsetWidth;
      t.classList.add('playing');
    }
    try { history.replaceState(null, '', '#' + (i+1)); } catch(e){}
  }

  function go(i){
    if (i < 0 || i >= SCENES.length || i === cur) return;
    var dir = i > cur ? 'next' : 'prev';
    var first = cur === -1;
    cur = i;
    clearTimeout(busy);
    if (first || reduce){ paint(i); schedule(); return; }
    canvas.classList.add('out-' + dir);
    capEl.classList.add('out');
    busy = setTimeout(function(){
      paint(i);
      canvas.classList.remove('out-next','out-prev');
      capEl.classList.remove('out');
      schedule();
    }, 200);
  }

  function schedule(){
    clearTimeout(timer);
    if (!playing) return;
    timer = setTimeout(function(){
      if (cur < SCENES.length - 1) go(cur + 1); else stop();
    }, DWELL);
  }

  function start(){
    if (cur === SCENES.length - 1) { cur = -1; go(0); }
    playing = true;
    playBtn.classList.add('on');
    playBtn.setAttribute('aria-pressed','true');
    playBtn.textContent = '❚❚ Pause';
    paint(cur);
    schedule();
  }
  function stop(){
    playing = false;
    clearTimeout(timer);
    playBtn.classList.remove('on');
    playBtn.setAttribute('aria-pressed','false');
    playBtn.textContent = '▶ Auto-play';
    var t = ticks[cur]; if (t) t.classList.remove('playing');
  }

  prevBtn.addEventListener('click', function(){ stop(); go(cur - 1); });
  nextBtn.addEventListener('click', function(){ stop(); go(cur + 1); });
  playBtn.addEventListener('click', function(){ playing ? stop() : start(); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight'){ stop(); go(cur + 1); }
    else if (e.key === 'ArrowLeft'){ stop(); go(cur - 1); }
    else if (e.key === 'Home'){ stop(); go(0); }
    else if (e.key === 'End'){ stop(); go(SCENES.length - 1); }
    else if (e.key === ' ' && e.target === document.body){ e.preventDefault(); playing ? stop() : start(); }
  });

  var sx = null;
  stage.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50){ stop(); go(cur + (dx < 0 ? 1 : -1)); }
  });

  var h = parseInt((location.hash || '').slice(1), 10);
  go(h >= 1 && h <= SCENES.length ? h - 1 : 0);
})();
</script>
