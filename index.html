<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Security — Scene-by-Scene SVG Walkthrough</title>
<style>
:root { color-scheme: light; --ink:#202124; --muted:#687078; --line:#e5e7eb; --accent:#168f70; }
* { box-sizing:border-box; }
body { margin:0; background:#f5f6f7; color:var(--ink); font:16px/1.5 Inter,system-ui,Segoe UI,sans-serif; }
main { max-width:1100px; margin:0 auto; padding:28px 18px 40px; }
header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; }
h1 { font-size:clamp(23px,4vw,34px); margin:0; letter-spacing:-.04em; }
.sub { color:var(--muted); margin:5px 0 0; }
.counter { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.stage { background:white; border:1px solid var(--line); border-radius:18px; padding:clamp(8px,2vw,18px); box-shadow:0 10px 30px #17202a0a; }
svg { display:block; width:100%; height:auto; max-height:70vh; background:#fff; }
.scene-title { font-size:20px; font-weight:650; margin:12px 4px 0; }
.progress { height:5px; background:#e9ecef; border-radius:9px; overflow:hidden; margin:18px 0; }
.progress > div { height:100%; background:var(--accent); width:6.66%; transition:width .2s; }
.controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
button { border:1px solid #d5d9de; background:white; color:var(--ink); padding:10px 16px; border-radius:10px; font:inherit; cursor:pointer; }
button.primary { background:var(--ink); color:white; border-color:var(--ink); }
button:disabled { opacity:.4; cursor:not-allowed; }
#play { margin-left:auto; }
.hint { color:var(--muted); font-size:13px; margin:14px 4px 0; }
@media(max-width:600px) { header { align-items:flex-start; flex-direction:column; } #play { margin-left:0; } }
</style>
